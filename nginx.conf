server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check for the ALB target group.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Hashed build assets can be cached forever.
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Runtime config differs per environment and must never be cached.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # index.html must never be cached, so new deploys show up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths (e.g. /about) are handled by the Angular router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
